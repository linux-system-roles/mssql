---
- name: Test role include variable override
  hosts: all
  tasks:
    - name: Run test in a block to clean up in always
      block:
        - name: >-
            Create var file in caller that can override the one in called role
          delegate_to: localhost
          copy:
            # usually the fake file will cause the called role to crash of
            # overriding happens, but if not, set a variable that will
            # allow to detect the bug
            content: "__caller_override: true"
            # XXX ugly, self-modifying code - changes the "caller" role on
            # the controller
            dest: "{{ playbook_dir }}/roles/caller/vars/{{ item }}.yml"
            mode: preserve
          loop: "{{ varfiles | unique }}"
          # In case the playbook is executed against multiple hosts, use
          # only the first one. Otherwise the hosts would stomp on each
          # other since they are changing files on the controller.
          when: inventory_hostname == ansible_play_hosts_all[0]
          vars:
            # change to hostvars['localhost']['ansible_facts'] to use the
            # information for localhost
            facts: "{{ ansible_facts }}"
            versions:
              - "{{ facts['distribution_version'] }}"
              - "{{ facts['distribution_major_version'] }}"
            separators: ["-", "_"]
            # create all variants like CentOS, CentOS_8.1, CentOS-8.1,
            # CentOS-8, CentOS-8.1
            # more formally:
            # {{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_version'] }}
            # {{ ansible_facts['distribution'] }}-\
            # {{ ansible_facts['distribution_major_version'] }}
            # {{ ansible_facts['distribution'] }}
            # {{ ansible_facts['os_family'] }}
            # and the same for _ as separator.
            varfiles: "{{ [facts['distribution']] | product(separators) |
              map('join') | product(versions) | map('join') | list +
              [facts['distribution'], facts['os_family']] }}"
          register: __varfiles_created

        - name: See if /dev/log exists for the fingerprint check
          ansible.builtin.stat:
            path: /dev/log
          register: __register_dev_log

        - name: Set the start time for the journal search
          ansible.builtin.set_fact:
            __journal_start_time: "{{ ansible_facts['date_time']['date'] ~ ' ' ~ ansible_facts['date_time']['time'] }}"
          when: __register_dev_log.stat.exists

        - name: Import role
          import_role:
            name: caller
          vars:
            roletoinclude: linux-system-roles.mssql
            __mssql_write_log_file: true
            mssql_accept_microsoft_odbc_driver_for_sql_server_eula: true
            mssql_accept_microsoft_cli_utilities_for_sql_server_eula: true
            mssql_accept_microsoft_sql_server_standard_eula: true
            mssql_version: "{{
              '2022' if (ansible_facts['distribution_major_version']
              is version('9', '>=') or
              ansible_facts['distribution'] in ['Fedora'])
              else '2017' }}"
            mssql_password: P@55w0rD
            mssql_edition: Evaluation
            __mssql_test_confined_supported: "{{
              ((ansible_facts['distribution'] in ['CentOS', 'RedHat']) and
              (ansible_facts['distribution_major_version'] is version('9', '>='))) or
              (ansible_facts['distribution'] in ['Fedora']) }}"
            mssql_manage_selinux: "{{ __mssql_test_confined_supported }}"
            mssql_run_selinux_confined: "{{ __mssql_test_confined_supported }}"

        - name: Get fingerprint entries from journal
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: >-
              set -eo pipefail;
              journalctl --since "{{ __journal_start_time }}" --no-pager |
              grep -v " Invoked with" |
              grep "sr_fingerprint.*role_name=mssql"
          register: __register_journal_fingerprints
          changed_when: false
          when: __register_dev_log.stat.exists

        - name: Check that the log file was written
          ansible.builtin.slurp:
            path: /var/log/sysroles.jsonl
          register: __register_log_file

        - name: Verify log file and journal fingerprints
          when: __register_dev_log.stat.exists
          vars:
            __journal_lines: "{{ __register_journal_fingerprints.stdout_lines }}"
            __journal_begin: "{{ __journal_lines | select('search', 'status=begin') | list }}"
            __journal_success: "{{ __journal_lines | select('search', 'status=success') | list }}"
            __begin_date: "{{ (__journal_begin[0] | regex_search('date=([^ ]+)', '\\1'))[0] }}"
            __success_date: "{{ (__journal_success[0] | regex_search('date=([^ ]+)', '\\1'))[0] }}"
            __file_content: "{{ __register_log_file.content | b64decode }}"
          block:
            - name: Print contents of logs
              debug:
                var: item
              loop:
                - "{{ __file_content }}"
                - "{{ __journal_lines }}"

            - name: Assert content is correct
              ansible.builtin.assert:
                that:
                  - __journal_begin | length > 0
                  - __journal_success | length > 0
                  - __begin_date in __file_content
                  - __success_date in __file_content
      always:
        - name: Cleanup
          file:
            path: "{{ item.dest }}"
            state: absent
          loop: "{{ __varfiles_created.results }}"
          delegate_to: localhost
          when: inventory_hostname == ansible_play_hosts_all[0]

        - name: Clean up after the role invocation
          include_tasks: tasks/cleanup.yml
          tags: cleanup
