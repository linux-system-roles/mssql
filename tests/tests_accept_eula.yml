# SPDX-License-Identifier: MIT
---
- name: Ensure that the role runs when EULA are accepted
  hosts: all
  vars:
    mssql_accept_microsoft_odbc_driver_for_sql_server_eula: true
    mssql_accept_microsoft_cli_utilities_for_sql_server_eula: true
    mssql_accept_microsoft_sql_server_standard_eula: true
    __mssql_gather_facts_no_log: true
  tasks:
    # Resolve fact-dependent values while ansible_facts is populated.
    # Register the result; meta: clear_facts does not clear registered vars.
    - name: Set version and SELinux variables from gathered facts
      set_fact:
        __mssql_test_version: "{{
          '2022' if (ansible_facts['distribution_major_version']
          is version('9', '>=') or
          ansible_facts['distribution'] in ['Fedora'])
          else '2017' }}"
        __mssql_test_confined_supported: "{{
          ((ansible_facts['distribution'] in ['CentOS', 'RedHat']) and
          (ansible_facts['distribution_major_version'] is version('9', '>=')))
          or (ansible_facts['distribution'] in ['Fedora']) }}"
      register: __mssql_test_vars

    - name: Run test in a block to clean up in always
      block:
        - name: Verify the failure on a fresh host when required vars undefined
          block:
            - name: Run the role with default parameters
              include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                mssql_version: "{{
                  __mssql_test_vars.ansible_facts.__mssql_test_version }}"
                mssql_manage_selinux: "{{
                  __mssql_test_vars.ansible_facts.__mssql_test_confined_supported
                  | bool }}"
                mssql_run_selinux_confined: "{{
                  __mssql_test_vars.ansible_facts.__mssql_test_confined_supported
                  | bool }}"

            - name: Unreachable task
              fail:
                msg: The above task must fail

          rescue:
            - name: Assert that the role failed with variables undefined
              assert:
                that: >-
                  'You must define the following variables to set up MSSQL' in
                  ansible_failed_result.msg.0
      always:
        - name: Clean up after the role invocation
          include_tasks: tasks/cleanup.yml
